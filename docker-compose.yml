services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: parkit_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parkit}
      POSTGRES_USER: ${POSTGRES_USER:-parkit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_db_password}
    volumes:
      - parkit_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parkit_user} -d ${POSTGRES_DB:-parkit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────────────────────────
  backend:
    image: indsutryproject-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parkit_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-parkit_user}:${POSTGRES_PASSWORD:-change_me_db_password}@db:5432/${POSTGRES_DB:-parkit}?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace_with_strong_secret_min_32_chars}
      MFA_ENC_KEY: ${MFA_ENC_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      PORT: 3000
      NODE_ENV: production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-operator123}
    ports:
      - "3000:3000"

  # ── Admin Web Dashboard (Vite/React) ─────────────────────────────────────────
  frontend:
    image: indsutryproject-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parkit_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  parkit_pgdata:
    driver: local
