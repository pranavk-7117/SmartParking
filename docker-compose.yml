services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: parkit_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parkit}
      POSTGRES_USER: ${POSTGRES_USER:-parkit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_db_password}
    volumes:
      - parkit_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parkit_user} -d ${POSTGRES_DB:-parkit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - parkit_network

  # ── Backend API ───────────────────────────────────────────────────────────────
  backend:
    image: parkit-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parkit_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-parkit_user}:${POSTGRES_PASSWORD:-change_me_db_password}@db:5432/${POSTGRES_DB:-parkit}?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace_this_with_a_random_64char_string_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      MFA_ENC_KEY: ${MFA_ENC_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
      APK_DOWNLOAD_SECRET_PATH: ${APK_DOWNLOAD_SECRET_PATH:-/distribution/d9f8e7a6b5c4123-operator.apk}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-operator123}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - parkit_network

  # ── Admin Web Dashboard (Vite/React + Nginx) ─────────────────────────────────
  frontend:
    image: parkit-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parkit_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - parkit_network

networks:
  parkit_network:
    driver: bridge

volumes:
  parkit_pgdata:
    driver: local
